<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>สมัครสมาชิก // Hardware Index</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; background:#0f172a;">
  <div style="background:#1e293b; padding:2rem; border-radius:8px; width:320px; color:#fff;">
    <h2>สมัครสมาชิกใหม่</h2>
    <form id="registerForm" style="margin-top:1rem;">
      <input type="text" id="username" placeholder="Username" required style="width:100%; margin-bottom:1rem; padding:8px;">
      <input type="email" id="email" placeholder="Email" required style="width:100%; margin-bottom:1rem; padding:8px;">
      <input type="password" id="password" placeholder="Password" required style="width:100%; margin-bottom:1rem; padding:8px;">
      <button type="submit" style="width:100%; padding:10px; background:#10b981; color:#fff; border:none; cursor:pointer; font-weight:bold;">สมัครสมาชิก</button>
    </form>
    <p style="margin-top:1rem; text-align:center;"><a href="/login.html" style="color:#60a5fa;">มีบัญชีอยู่แล้ว? เข้าสู่ระบบ</a></p>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });

      if (res.ok) {
        alert('สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ');
        window.location.href = '/login.html';
      } else {
        alert('เกิดข้อผิดพลาดในการสมัครสมาชิก');
      }
    });
  </script>
</body>
</html>
