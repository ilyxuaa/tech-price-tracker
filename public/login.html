<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Login // Hardware Index</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh;">
  <div style="background:#1e293b; padding:2rem; border-radius:8px; width:300px;">
    <h2 style="color:#fff; margin-bottom:1rem;">เข้าสู่ระบบ</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required style="width:100%; margin-bottom:1rem; padding:8px;">
      <input type="password" id="password" placeholder="Password" required style="width:100%; margin-bottom:1rem; padding:8px;">
      <button type="submit" style="width:100%; padding:10px; background:#3b82f6; color:#fff; border:none; cursor:pointer;">Login</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.role);
        alert('Login สำเร็จ!');
        window.location.href = '/'; // กลับหน้าหลัก
      } else {
        alert(data.message || 'Login ไม่สำเร็จ');
      }
    });
  </script>
</body>
</html>
